# Recette Vague 1 (porte de release) jouée contre staging, SUR DISPATCH MANUEL UNIQUEMENT
# depuis la mise en standby du projet (31/07/2026) — voir le bloc `on:` ci-dessous.
# Commandes et chemins : voir e2e/staging/README.md §6.
#
# La session QA est obtenue par LOGIN PROGRAMMATIQUE d'un compte de service local, à chaque
# test (e2e/staging/lib/auth.ts). Deux conséquences, documentées dans e2e/staging/README.md §3 :
#   - le test de garde tourne avant tout le reste ; s'il échoue, les cas restent NON
#     exécutés et le motif est « session expirée », jamais un bug produit ;
#   - il n'y a plus ni storageState à restaurer, ni session à republier en fin de job : la
#     rotation du refresh token ne concerne plus personne, chaque test ouvre la sienne.
name: QA Nightly — Staging

on:
  # MISE EN SOMMEIL — standby du projet, 31/07/2026. Le cron quotidien (04h30 UTC = 06h30
  # Paris, du lundi au vendredi) est RETIRÉ : il n'y a plus de flux de dev à surveiller, et
  # une recette qui tourne chaque nuit sur un produit figé ne produit que du bruit et de la
  # consommation. La nightly ne se réveille plus que sur demande explicite.
  #
  # Pour la rejouer :  gh workflow run "QA Nightly — Staging" --repo POPAISTUDIO/vermeer-text
  #
  # Le canary (canary-providers.yml) GARDE son cron : il reste le seul œil automatique sur
  # staging tant que la sonde de production n'existe pas. Son sort se règlera avec elle.
  #
  # À noter : ce retrait ne coupe pas le réveil post-train. `release-train.yml` déclenche ce
  # workflow par `gh workflow run` (donc via workflow_dispatch, conservé ci-dessous) ; ce
  # chemin ne se tait que parce que le train lui-même n'a plus rien à propager en standby.
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

# Groupe PARTAGÉ avec canary-providers.yml : la session staging ne supporte pas deux
# consommateurs simultanés (rotation du refresh token). On sérialise au lieu d'annuler,
# pour ne jamais interrompre un run au milieu d'une rotation.
concurrency:
  group: qa-session
  cancel-in-progress: false

jobs:
  wave1:
    name: Recette Vague 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances de la suite
        working-directory: e2e/staging
        run: npm ci

      - name: Installer Chromium
        working-directory: e2e/staging
        run: npx playwright install --with-deps chromium

      # Plus d'étape de restauration de session : la suite s'authentifie elle-même. Si les
      # identifiants du compte de service manquent ou sont refusés, c'est le TEST DE GARDE
      # qui échoue — et le triage le classe « SESSION EXPIRÉE », sa catégorie existante.
      # Un exit 1 posé ici, avant Playwright, produirait un échec sans rapport à analyser :
      # on laisse donc délibérément la garde porter ce cas.

      # `--grep-invert @known-issue` : un cas tagué `@known-issue-N` est un défaut connu et
      # dépriorisé (README §5). Il sort du verdict P0 sans quitter la suite — donc sans
      # quitter son tag `@wave1`, qu'il retrouve dès que le tag `@known-issue-N` est retiré.
      # Le gate ne compte que ce qui reste : c'est le garde-fou 3 du triage désignateur
      # (GOVERNANCE.md §2), côté suite. La garde de session porte tous les tags de la suite
      # mais aucun `@known-issue-N` : elle n'est jamais filtrée par cette exclusion.
      - name: Recette Vague 1
        id: wave1
        continue-on-error: true
        working-directory: e2e/staging
        env:
          BASE_URL: ${{ secrets.QA_STAGING_URL }}
          QA_SERVICE_EMAIL: ${{ secrets.QA_SERVICE_EMAIL }}
          QA_SERVICE_PASSWORD: ${{ secrets.QA_SERVICE_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: report.json
        run: npx playwright test --grep @wave1 --grep-invert @known-issue

      - name: Publier le rapport et les traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-wave1-report
          path: |
            e2e/staging/report.json
            e2e/staging/playwright-report/
            e2e/staging/test-results/
          retention-days: 14
          if-no-files-found: warn

      # L'étape « Persister la session rotatée » a disparu avec le storageState : le compte de
      # service se reconnecte à chaque test, il n'y a donc plus de session à faire survivre
      # d'un run au suivant. Le job n'a plus besoin d'un jeton en écriture sur les secrets.

      # Le label doit exister avant que l'analyse ne tente `gh issue create --label`.
      - name: Garantir le label qa-nightly
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create qa-nightly --color 1d76db --description "Dossier QA nightly" 2>/dev/null || true

      - name: Analyse du rapport et tenue du Dossier QA
        if: always()
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions"
          prompt: |
            Tu rends compte d'un run de recette automatisée contre staging. Tu ne corriges
            rien, tu ne modifies aucun fichier : tu lis des faits et tu tiens un dossier.

            Sources de vérité, dans cet ordre :
              1. `e2e/staging/report.json` — rapport JSON Playwright du run.
              2. `e2e/staging/test-results/**/error-context.md` — contexte des échecs.
              3. `e2e/staging/README.md` — §5 tags, §6 cas couverts, §9 divergences assumées.

            Résultat de l'étape Playwright : ${{ steps.wave1.outcome }}
            Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            RÈGLES D'HONNÊTETÉ — non négociables :
            - Un cas n'est PASS que si le rapport JSON le dit. Tu ne déduis jamais un
              succès d'une absence d'information.
            - Si `report.json` est absent ou illisible, tu l'écris explicitement et tu
              t'arrêtes là sur l'analyse des cas : la suite a probablement échoué avant de
              produire un rapport (config, session, installation).
            - Un test « skipped » n'est pas un test qui passe. CTX-02 est un SKIP motivé
              connu (cf. README §9.3) : rappelle-le en une ligne, ce n'est pas une
              régression.
            - Tu distingues systématiquement trois natures d'échec :
                * ÉCHEC PRODUIT — une assertion métier est fausse (statut HTTP, contenu,
                  comportement UI).
                * ÉCHEC INFRA — timeout d'installation, réseau, runner, artefact manquant.
                * SESSION EXPIRÉE — cf. cas particulier ci-dessous.
              Si tu ne peux pas trancher, écris INDÉTERMINÉ et dis ce qui manque.

            CAS PARTICULIER — SESSION EXPIRÉE (prioritaire) :
            Si l'échec est le test de garde (`guard.setup.ts`, « GUARD — la session QA est
            valide et authentifiée »), alors la session QA est morte et les 12 cas n'ont
            PAS tourné. Ce n'est pas un bug produit et il ne faut surtout pas le présenter
            comme tel. Le dossier doit contenir UNE ligne actionnable, du type :
            « Session QA indisponible — le compte de service ne s'authentifie pas
            (e2e/staging/README.md §3), aucun cas exécuté, aucune conclusion produit
            possible sur ce run. »
            N'analyse alors aucun autre échec : il n'y en a pas.

            CE QUE TU FAIS :
            1. Cherche l'issue ouverte servant de Dossier QA :
               `gh issue list --label qa-nightly --state open`
               - Si elle existe, ajoute un commentaire daté avec ton compte rendu.
               - Sinon, crée-la : titre « Dossier QA nightly », label `qa-nightly`, et mets
                 ton compte rendu dans le corps.
            2. Le compte rendu, court et factuel :
               - une ligne de verdict (vert / rouge, et pourquoi) ;
               - le décompte réel passés / échoués / skippés tel que lu dans le JSON ;
               - pour chaque échec : identifiant du cas (GEN-02, FILE-01…), nature
                 (PRODUIT / INFRA / SESSION EXPIRÉE / INDÉTERMINÉ), et l'assertion exacte
                 qui a cassé, citée depuis le rapport ;
               - le lien du run.
            3. Si tout est vert, dis-le en deux lignes. Pas de commentaire fleuve.

            Tu ne crées ni ne fermes aucune autre issue. Le triage des bugs produit est le
            travail d'un autre workflow (qa-triage.yml) — pas le tien.
          claude_args: |
            --max-turns 25
            --allowedTools "Read,Glob,Grep,Bash(gh issue *)"
            --append-system-prompt "Tu rends compte de faits de QA : jamais un succès que le rapport ne prouve pas, jamais une expiration de session présentée comme un défaut produit."

      - name: Gate — la Vague 1 est la porte de release
        if: always()
        run: |
          if [ "${{ steps.wave1.outcome }}" != "success" ]; then
            echo "::error::Recette Vague 1 en échec — voir le Dossier QA et les artefacts de ce run."
            exit 1
          fi
          echo "Vague 1 verte."
