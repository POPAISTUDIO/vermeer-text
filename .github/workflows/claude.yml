# Agent codeur — deux modes :
# 1. Interactif : mention @claude dans une issue ou PR
# 2. Autonome : issue labellisée claude-fix (posée par l'agent triage ou par Loïse)
# Ouvre des PRs, ne merge JAMAIS. Le merge reste humain (Loïse).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # Mode interactif — @claude
  claude-interactive:
    # L'exclusion de claude[bot] coupe les runs fantomes : les commentaires que l'agent poste
    # lui-meme (suivi de progression, compte rendu) sont des evenements issue_comment qui le
    # reveillent en echo. OBSERVED 30/07/2026 : runs 79 et 81 declenches avec
    # github.actor == 'claude[bot]' — le 79 n'a ete epargne que parce que le corps du
    # commentaire ne portait pas '@claude'. Filtrer sur l'acteur ne depend plus du contenu.
    # Loise n'est pas un bot : un '@claude' de sa part declenche toujours.
    if: |
      github.actor != 'github-actions[bot]' &&
      github.actor != 'claude[bot]' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.action != 'labeled' && contains(github.event.issue.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
            --append-system-prompt "Respecte CLAUDE.md. Ne merge jamais de PR. Toute modification passe par une branche + PR avec description structurée (contexte, changement, comment tester)."

      # GOVERNANCE.md §2 regle 4 — « bruyant » veut dire : une notification que Loise RECOIT,
      # sans aller la chercher dans l'onglet Actions. Incident du 30/07/2026, run 80 : ce job est
      # mort a max-turns (40), le job est bien sorti ROUGE... et personne n'a rien recu. Un statut
      # de run ne notifie personne. Le canal fiable est celui du plafond du triage (garde-fou 4) :
      # commentaire sur le fil + ASSIGNATION. L'ordre compte — le commentaire d'abord, car c'est
      # lui qui porte la notification ; l'assignation ensuite, meme si elle echoue.
      - name: Échec bruyant
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          EST_PR: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${NUM:-}" ]; then
            echo "::warning::Aucun numero d'issue ou de PR dans le contexte — pas de canal pour alerter."
            exit 0
          fi

          MESSAGE="⚠️ Run interrompu (budget épuisé ou erreur) — [voir le run]($RUN_URL). Si la demande était une implémentation, relance par cycle du label « claude-fix » (budget 150 tours) plutôt que par @claude (40 tours)."

          if [ "$EST_PR" = "true" ]; then
            gh pr comment "$NUM" --repo "$REPO" --body "$MESSAGE" \
              || echo "::warning::Commentaire impossible a poster sur la PR $NUM."
            # Une review ne peut pas etre demandee a l'autrice de la PR (422) : repli sur
            # l'assignation, qui accepte l'autrice. Le canal de notification est preserve.
            if ! gh pr edit "$NUM" --repo "$REPO" --add-reviewer Loisetoscer 2>/dev/null; then
              echo "::warning::Review non demandable (autrice de la PR ?) — repli sur l'assignation."
              gh pr edit "$NUM" --repo "$REPO" --add-assignee Loisetoscer \
                || echo "::warning::Assignation impossible sur la PR $NUM."
            fi
          else
            gh issue comment "$NUM" --repo "$REPO" --body "$MESSAGE" \
              || echo "::warning::Commentaire impossible a poster sur l'issue $NUM."
            gh issue edit "$NUM" --repo "$REPO" --add-assignee Loisetoscer \
              || echo "::warning::Assignation impossible sur l'issue $NUM."
          fi
          echo "::error::Run interrompu — $REPO#$NUM commente et confie a Loisetoscer."

  # Mode autonome — label claude-fix
  claude-autofix:
    # Budget dimensionne pour des FEATURES, pas pour des retouches (OBSERVED 30/07/2026,
    # run 83 sur l'issue 141 : 67 tours et 9m38 de modele consommes sur un bouton de theme,
    # sous un plafond de 80 tours — donc au bord). 150 tours / 90 min laissent la place a la
    # sequence draft-first, qui coute des tours de git et de gh en plus de l'implementation.
    # claude-interactive reste a 40 tours : reprises et petits gestes.
    # ⚠️ La garde claude[bot] ci-dessous est defensive, pas fonctionnelle : ce job ne repond
    # qu'a issues/labeled, donc aucun issue_comment ne l'atteint. Elle est la pour le jour ou
    # le declencheur s'elargirait. A SAVOIR AVANT DE LA GARDER : si la pose de claude-fix
    # passait un jour sous l'identite claude[bot], cette ligne casserait silencieusement la
    # designation automatique (GOVERNANCE.md §2, second designateur) — il faudrait alors la
    # retirer. Aujourd'hui le risque est nul : le triage pose le label avec GITHUB_TOKEN, donc
    # sous l'identite github-actions[bot] (OBSERVED — qa-triage.yml, GH_TOKEN du step).
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'claude-fix' &&
      github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Traite l'issue #${{ github.event.issue.number }} de bout en bout.

            ORDRE IMPÉRATIF — la PR draft AVANT l'implémentation :
            1. Crée la branche fix/issue-${{ github.event.issue.number }}.
            2. Fais un premier commit minimal.
            3. OUVRE IMMÉDIATEMENT une PR en DRAFT référençant l'issue
               (Closes #${{ github.event.issue.number }}) — AVANT toute implémentation
               substantielle. Une description d'une ligne suffit à ce stade.
            4. Implémente en poussant des commits réguliers sur la branche — jamais plus de
               quelques minutes de travail non poussé.
            5. À la fin : complète la description de la PR (analyse, changements, comment
               vérifier en staging), puis passe la PR READY FOR REVIEW.

            Une PR laissée en DRAFT signifie : travail inachevé, reprenable par un commentaire
            @claude sur la PR. C'est un état légitime — pas un échec à camoufler. Ne passe une
            PR ready que si le travail est réellement fini.

            Le travail lui-même, à mener dans le cadre de cette séquence :
            - Établis ta compréhension du bug SANS la commenter sur l'issue. Elle ira dans la
              description de la PR, pas dans un commentaire préalable.
            - Localise la cause racine dans le code (pas de fix symptomatique).
            - Garde le diff minimal : uniquement le code lié au bug.
            - Fais tourner typecheck et les tests unitaires concernés ; compare aux baselines
              connues (erreurs TS et échecs Jest préexistants documentés dans CLAUDE.md) —
              n'introduis aucune régression nouvelle.

            Si tu ne parviens pas à identifier la cause racine avec confiance, n'ouvre PAS de
            PR : commente l'issue avec ton analyse et ce qui te bloque, et termine ce
            commentaire par cette ligne exacte, seule sur sa ligne :
            <!-- verdict: analyse-seule -->
            Ce marqueur est ce qui distingue un arrêt réfléchi d'un run mort en cours de
            route : sans lui, l'étape « Verdict livrable » fera sortir ce job en ROUGE.
          claude_args: |
            --max-turns 150
            --append-system-prompt "Respecte CLAUDE.md. Ne merge jamais. Ne modifie que le code lié au bug — aucun refactoring opportuniste. Ordre de travail impératif : (1) branche fix/issue-N ; (2) premier commit minimal ; (3) OUVRE IMMÉDIATEMENT une PR en DRAFT référençant l'issue (Closes #N), AVANT toute implémentation substantielle ; (4) implémente en poussant des commits réguliers sur la branche — jamais plus de quelques minutes de travail non poussé ; (5) à la fin : description de PR complétée (analyse, changements, comment vérifier), PR passée READY FOR REVIEW. Une PR laissée en draft signifie : travail inachevé, reprenable par un commentaire @claude sur la PR. Ne publie pas de commentaire d'analyse préalable — ton analyse complète va dans la DESCRIPTION de la PR. Deux issues possibles et deux seulement : (1) une PR ouverte référençant l'issue ; (2) si et seulement si la cause racine n'est pas identifiée avec confiance, un unique commentaire d'analyse se terminant par le marqueur <!-- verdict: analyse-seule -->. Un commentaire qui annonce une implémentation à venir est interdit : au moment de l'écrire, ouvre la PR draft à la place."

      # Garde-fou GOVERNANCE.md §2 regle 4 : « en depassement, echouer bruyamment ». Un run
      # d'agent codeur qui finit sans rien livrer doit etre ROUGE — rouge = notification GitHub
      # native, donc zero surveillance manuelle. Incident fondateur : run 77 du 30/07/2026 sur
      # l'issue 141 — long commentaire d'analyse, annonce d'implementation (« je pars sur la
      # branche fix/issue-141 »), puis fin en Success SANS branche poussee ni PR. Le vert a menti.
      # Second incident, run 83 du meme jour sur la meme issue : 67 tours, 9m38, Success, et
      # AUCUNE trace — pas de branche, pas de PR, pas meme un commentaire. D'ou la sequence
      # draft-first du prompt : le travail doit etre visible AVANT d'etre fini.
      # Trois verdicts, pas deux : PR ready = vert ; PR draft = rouge qui dit OU est le travail ;
      # ni PR ni marqueur = rouge qui constate une disparition.
      # Cette etape ne consomme que gh pr list + gh issue comment/edit + gh pr edit : rien a
      # desserrer dans le bloc permissions du workflow.
      - name: Verdict livrable
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          MARQUEUR='<!-- verdict: analyse-seule -->'

          # (a) Une PR OUVERTE livre-t-elle le travail ? Deux facons de la reconnaitre : sa
          #     branche fix/issue-N (suffixe tolere — cf. fix/issue-137-renvois-workflow, sans
          #     jamais confondre #141 et #1410), ou un corps qui reference l'issue.
          #     `gh pr list` retourne les brouillons comme les autres : un draft EST une PR
          #     ouverte. C'est voulu — on veut le TROUVER, puis le traiter differemment.
          if ! gh pr list --repo "$REPO" --state open --limit 100 \
                 --json number,url,headRefName,body,isDraft > "$RUNNER_TEMP/prs.json"; then
            echo "::error::Impossible d'interroger les PR ouvertes — verdict indeterminable."
            exit 1
          fi
          #     La branche PRIME sur le renvoi dans le corps : les deux signaux ne valent pas
          #     pareil. Un corps peut mentionner « #N » en prose (« ne pas confondre avec
          #     #141 ») sans etre la PR de l'issue ; une branche fix/issue-N, non. Avec un
          #     `select(A or B) | first`, c'est l'ordre de `gh pr list` (le plus recent
          #     d'abord) qui tranchait — donc une PR etrangere pouvait masquer la vraie et
          #     faire lire le mauvais etat draft/ready. OBSERVED : defaut trouve par le rejeu
          #     du verdict (fixture pr-ready, leurre #1410) le 30/07/2026.
          PR=$(jq -c \
            --arg branche "^fix/issue-${ISSUE}"'(-|$)' \
            --arg renvoi "(^|[^0-9])#${ISSUE}"'([^0-9]|$)' \
            '([.[] | select(.headRefName | test($branche))] | first)
             // ([.[] | select((.body // "") | test($renvoi))] | first)
             // empty' "$RUNNER_TEMP/prs.json")
          if [ -n "$PR" ]; then
            NUMERO=$(printf '%s' "$PR" | jq -r '.number')
            URL=$(printf '%s' "$PR" | jq -r '.url')

            # (a.1) PR en DRAFT : le contrat de la sequence draft-first n'est pas rempli — la
            #       PR devait etre passee ready a la fin. Le travail EXISTE et il est VISIBLE,
            #       ce qui est tout l'objet de la sequence ; mais il est inacheve, donc le run
            #       sort ROUGE. Difference avec le cas (c) : le rouge dit desormais OU est le
            #       travail, au lieu de constater une disparition. La reprise se fait sur la PR
            #       (le contexte du diff y est) et non sur l'issue.
            if [ "$(printf '%s' "$PR" | jq -r '.isDraft')" = "true" ]; then
              gh issue comment "$ISSUE" --repo "$REPO" --body \
                "⚠️ Travail partiel visible en PR #${NUMERO} (draft). Reprise : commenter « @claude continue » sur la PR." \
                || echo "::warning::Commentaire impossible a poster sur l'issue $ISSUE."
              gh issue edit "$ISSUE" --repo "$REPO" --add-assignee Loisetoscer \
                || echo "::warning::Assignation impossible sur l'issue $ISSUE."
              echo "::error::PR #${NUMERO} laissee en draft — travail inacheve, visible en $URL."
              exit 1
            fi

            # (a.2) PR READY : livrable complet.
            echo "Livrable : $URL"
            # La demande de review est le seul canal qui notifie a COUP SUR l'ouverture d'une PR
            # — et elle dit la verite du systeme : toute PR d'agent attend la relecture de
            # l'ecluse (GOVERNANCE.md §4). Erreur ignoree : sur un second passage la review est
            # deja demandee, ce qui est le cas nominal et non un defaut. Pas de risque de 422
            # « review from author » ici, l'autrice de cette PR etant l'agent, pas Loise.
            gh pr edit "$NUMERO" --repo "$REPO" \
              --add-reviewer Loisetoscer 2>/dev/null \
              || echo "::notice::Review deja demandee (ou non demandable) sur cette PR."
            exit 0
          fi

          # (b) Arret legitime prevu par le prompt : le dernier commentaire de l'agent porte le
          #     marqueur. REST obligatoire ici — l'API GraphQL derriere « gh issue view »
          #     normalise l'auteur en « claude », le login exact « claude[bot] » n'est lisible
          #     qu'en REST (OBSERVED 30/07/2026, issue 141).
          if ! DERNIER=$(gh api \
                 "repos/$REPO/issues/$ISSUE/comments?per_page=100&sort=created&direction=desc" \
                 --jq '[.[] | select(.user.login == "claude[bot]")] | first | .body // empty'); then
            echo "::error::Lecture des commentaires de l'issue $ISSUE impossible — verdict indeterminable."
            exit 1
          fi
          if printf '%s' "$DERNIER" | grep -qF "$MARQUEUR"; then
            echo "Livrable : verdict d'analyse explicite (marqueur present) — arret legitime."
            exit 0
          fi

          # (c) Ni PR, ni verdict : ce run n'a rien livre. On le dit sur l'issue, et on sort rouge.
          #     Le commentaire est poste par github-actions[bot] via GITHUB_TOKEN : GitHub ne
          #     declenche aucun workflow sur ces evenements, et le job interactif exclut deja cet
          #     acteur — le '@claude' de la phrase de relance ne peut donc pas boucler. Ne PAS
          #     basculer cette etape sur un jeton personnel sans revoir ce point.
          gh issue comment "$ISSUE" --repo "$REPO" --body-file - <<EOF
          ⚠️ Run terminé sans livrable (ni PR, ni verdict d'analyse). Épuisement de budget probable. Relance : commenter « @claude reprends et ouvre la PR ».

          Run : $RUN_URL
          EOF
          # L'assignation est ce qui rend l'echec BRUYANT : un rouge dans l'onglet Actions ne
          # notifie personne (GOVERNANCE.md §2 regle 4, incident du 30/07/2026). Meme canal que le
          # plafond du triage. Apres le commentaire : c'est lui qui porte la notification, et il
          # ne doit pas etre perdu si l'assignation echoue.
          gh issue edit "$ISSUE" --repo "$REPO" --add-assignee Loisetoscer \
            || echo "::warning::Assignation impossible sur l'issue $ISSUE."
          echo "::error::Run termine sans livrable — ni PR ouverte, ni verdict d'analyse marque."
          exit 1