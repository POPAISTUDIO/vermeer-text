# Garde-fou court : les 4 cas @canary (GEN-02, GEN-03, GEN-06, SEL-01) vérifient que les
# trois fournisseurs répondent et que le catalogue de modèles est conforme.
# Commandes et chemins : voir e2e/staging/README.md §6. Pas d'analyse Claude ici : le
# déterminisme des assertions suffit, et un canary doit rester rapide et lisible.
name: Canary Providers

on:
  schedule:
    # 05h00 UTC = 07h00 Paris (heure d'été), du lundi au vendredi — après la nightly.
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Groupe PARTAGÉ avec qa-nightly.yml : un seul compte de service, et chaque cas déclenche de
# vrais appels LLM facturés — les deux workflows ne doivent jamais tourner en même temps.
concurrency:
  group: qa-session
  cancel-in-progress: false

jobs:
  canary:
    name: Canary fournisseurs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances de la suite
        working-directory: e2e/staging
        run: npm ci

      - name: Installer Chromium
        working-directory: e2e/staging
        run: npx playwright install --with-deps chromium

      # Plus d'étape de restauration de session : la suite s'authentifie elle-même par login
      # programmatique du compte de service. Un défaut d'identifiants fait échouer le TEST DE
      # GARDE, que le triage classe « SESSION EXPIRÉE » — sa catégorie existante.

      - name: Canary fournisseurs
        id: canary
        continue-on-error: true
        working-directory: e2e/staging
        env:
          BASE_URL: ${{ secrets.QA_STAGING_URL }}
          QA_SERVICE_EMAIL: ${{ secrets.QA_SERVICE_EMAIL }}
          QA_SERVICE_PASSWORD: ${{ secrets.QA_SERVICE_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: report.json
        run: npx playwright test --grep @canary

      - name: Publier le rapport et les traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report
          path: |
            e2e/staging/report.json
            e2e/staging/test-results/
          retention-days: 7
          if-no-files-found: warn

      # Même évolution que la nightly : l'étape de persistance de session a disparu avec le
      # storageState. Le compte de service se reconnecte à chaque test, il n'y a plus rien à
      # republier — et plus besoin d'un jeton en écriture sur les secrets.

      - name: Ouvrir une alerte si le canary est rouge
        if: steps.canary.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Labels créés à la demande : sans eux, `gh issue create --label` échoue.
          gh label create canary --color d73a4a --description "Canary fournisseurs" 2>/dev/null || true
          gh label create infra --color 0e8a16 --description "Infrastructure / environnement" 2>/dev/null || true

          {
            echo "Le canary fournisseurs (\`--grep @canary\` : GEN-02, GEN-03, GEN-06, SEL-01) est en échec."
            echo
            echo "Run : $RUN_URL"
            echo
            echo "## Point 0 avant tout diagnostic"
            echo
            echo "**Vérifier l'image réellement servie par le pod (Loki) avant de conclure quoi que ce soit.**"
            echo "Un canary rouge signifie très souvent que l'environnement ne fait pas tourner le build"
            echo "attendu — pas que le code est cassé. Tant que l'image n'est pas confirmée, aucune"
            echo "conclusion produit n'est valide."
            echo
            echo "## Ensuite seulement"
            echo
            echo "1. Si l'échec est le test de garde (\`GUARD\`), le compte de service ne s'authentifie pas"
            echo "   (voir \`e2e/staging/README.md\` §3). Ce n'est pas un bug produit."
            echo "2. Sinon, lire le rapport et les traces dans les artefacts du run (\`canary-report\`)."
            echo "3. GEN-06 en 403 → clé GCP à revérifier côté Ops."
            echo
            echo "_Issue ouverte automatiquement par le workflow \`Canary Providers\`._"
          } > canary-issue.md

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "🔴 Canary providers KO — $(date -u +%F)" \
            --label canary \
            --label infra \
            --body-file canary-issue.md

      - name: Gate — un canary rouge doit être rouge
        if: always()
        run: |
          if [ "${{ steps.canary.outcome }}" != "success" ]; then
            echo "::error::Canary fournisseurs en échec — voir l'issue ouverte et les artefacts."
            exit 1
          fi
          echo "Canary vert."
